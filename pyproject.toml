[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "linkedin-outreach-local"
version = "0.1.0"
description = "Local CSV-driven LinkedIn connection and follow-up workflow"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dynamic = ["dependencies"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Environment :: Console",
]

[project.scripts]
linkedin-outreach = "outreach:main"

[project.optional-dependencies]
dev = ["build>=1.2,<2", "ruff>=0.11,<1"]

[tool.setuptools]
py-modules = ["outreach", "linkedin_browser", "lead_data", "outreach_config", "outreach_setup", "outreach_errors"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [".local", ".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
